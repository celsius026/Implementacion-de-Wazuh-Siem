<!--
  Fragmento de ossec.conf relevante al alcance de este proyecto
  (FortiGate, FortiWeb, Darktrace, FortiSIEM, Banca Digital e integracion
  con la app movil). Fusionar con la configuracion base de Wazuh Manager.
-->
<ossec_config>

  <!-- Recepcion de logs de FortiGate/FortiWeb/Darktrace por syslog -->
  <remote>
    <connection>syslog</connection>
    <port>514</port>
    <protocol>udp</protocol>
    <!-- En produccion, restringir a las IPs reales de los dispositivos emisores -->
    <allowed-ips>0.0.0.0/0</allowed-ips>
  </remote>

  <remote>
    <connection>syslog</connection>
    <port>8888</port>
    <protocol>tcp</protocol>
    <allowed-ips>0.0.0.0/0</allowed-ips>
  </remote>

  <!-- Logs de FortiGate en formato syslog plano -->
  <localfile>
    <log_format>syslog</log_format>
    <location>/var/log/fortigate/*.log</location>
  </localfile>

  <!-- Salida del listener custom FortiSIEM (XML->JSON), ver docs/fortisiem-listener.md -->
  <localfile>
    <log_format>json</log_format>
    <location>/var/log/fortisiem/fortisiem.json</location>
    <label key="source">fortisiem</label>
  </localfile>

  <!-- Logs de auditoria de Banca Digital (JSON, prefijo CortexAuditWorker) -->
  <localfile>
    <log_format>json</log_format>
    <location>/tmp/cloudflare/cloudflare.log</location>
  </localfile>

  <!-- Integracion de alertas hacia la app movil, ver docs/integracion-app-movil.md -->
  <integration>
    <name>custom-send-data-to-app</name>
    <level>9</level>
    <alert_format>json</alert_format>
  </integration>

</ossec_config>
